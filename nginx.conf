# nginx configuration for the built LIRC Library System (single-page app).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change — keep them cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every route serves index.html so deep links (like /dashboard or
    # /register) work when opened directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
