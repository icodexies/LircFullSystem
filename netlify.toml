# Netlify configuration for the LIRC Library System (Vite + React SPA).
# Used both by Netlify's own Git builds and by the API deploy from GitHub
# Actions (scripts/deploy-netlify.mjs includes this file in the deploy).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route serves index.html so deep links
# (like /dashboard or /register) work when opened directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change — let browsers keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
