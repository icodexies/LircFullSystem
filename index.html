    <title>Learning and Information Resource Center | City College of Calamba</title>
    <script>
      // Apply the saved (or system) theme before the first paint so the page
      // never flashes light before switching to dark. The member workspace's
      // saved display size is applied here too — the public pages and the
      // station screens always keep their designed sizes.
      (function () {
        try {
          var saved = localStorage.getItem("lirc-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");

          var path = location.pathname;
          var keepsDesign =
            path === "/" ||
            path === "/unauthorized" ||
            path === "/system" ||
            path.indexOf("/register") === 0 ||
            path.indexOf("/forgot-password") === 0 ||
            path.indexOf("/reset-password") === 0;
          var savedSize = localStorage.getItem("lirc-ui-size");
          if (
            !keepsDesign &&
            (savedSize === "large" ||
              savedSize === "larger" ||
              savedSize === "largest")
          ) {
            document.documentElement.dataset.uiSize = savedSize;
          }        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
